services:
  - type: web
    name: odhikar-bd-api
    runtime: python
    plan: free
    branch: main
    autoDeploy: true

    buildCommand: python -m pip install -r requirements.txt

    startCommand: python -m uvicorn src.odhikar.api:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: ODHIKAR_ALLOWED_ORIGINS
        sync: false

      - key: DATABASE_POOL_MIN_SIZE
        value: "1"

      - key: DATABASE_POOL_MAX_SIZE
        value: "5"

      - key: DATABASE_POOL_TIMEOUT
        value: "30"
